<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TaskFlow | Team Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/styles.css" rel="stylesheet"></head>
<body>
  <aside class="app-sidebar"><a class="sidebar-brand" href="/"><span class="brand-mark">T</span><span>Task<span>Flow</span></span></a><p class="sidebar-label">Workspace</p><nav class="sidebar-nav"><a class="sidebar-link" href="/">Dashboard</a><a class="sidebar-link" href="/attendance.html">Attendance</a><a class="sidebar-link active" href="/admin-attendance.html">Team attendance</a><a class="sidebar-link" href="/settings.html">Settings</a></nav></aside>
  <nav class="navbar app-navbar"><div class="topbar-inner"><div><p class="topbar-kicker mb-0">Administration</p><h1 class="topbar-title mb-0">Team attendance</h1></div><button class="btn btn-sm btn-outline-secondary" id="logoutButton">Log out</button></div></nav>
  <main class="dashboard-main"><div id="alertArea" aria-live="polite"></div><div class="dashboard-heading"><div><p class="eyebrow mb-1">Attendance report</p><h1>Team attendance</h1></div></div>
    <section class="panel p-4 mb-4"><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label" for="attendanceDate">Business date</label><input class="form-control" type="date" id="attendanceDate"></div><div class="col-md-5"><label class="form-label" for="memberSearch">Search member</label><input class="form-control" id="memberSearch" placeholder="Name or email"></div><div class="col-md-3"><button class="btn btn-primary w-100" id="refreshButton">Refresh</button></div></div></section>
    <section class="row g-3 mb-4"><div class="col-md-3"><div class="panel p-3"><small>Registered members</small><strong class="d-block fs-3" id="membersCount">—</strong></div></div><div class="col-md-3"><div class="panel p-3"><small>Checked in</small><strong class="d-block fs-3" id="checkedInCount">—</strong></div></div><div class="col-md-3"><div class="panel p-3"><small>Checked out</small><strong class="d-block fs-3" id="checkedOutCount">—</strong></div></div><div class="col-md-3"><div class="panel p-3"><small>Currently checked in</small><strong class="d-block fs-3" id="currentCount">—</strong></div></div></section>
    <section class="panel p-4"><div id="tableState" class="text-secondary">Loading…</div><div class="table-responsive"><table class="table align-middle" id="attendanceTable" hidden><thead><tr><th>Member</th><th>Date</th><th>Check in</th><th>Check out</th><th>Status</th></tr></thead><tbody></tbody></table></div></section>
  </main><script src="/js/admin-attendance.js"></script>
</body>
</html>
