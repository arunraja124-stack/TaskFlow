<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TaskFlow | Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/styles.css" rel="stylesheet"></head>
<body>
  <aside class="app-sidebar"><a class="sidebar-brand" href="/"><span class="brand-mark">T</span><span>Task<span>Flow</span></span></a><p class="sidebar-label">Workspace</p><nav class="sidebar-nav"><a class="sidebar-link" href="/">Dashboard</a><a class="sidebar-link active" href="/attendance.html">Attendance</a><a class="sidebar-link" href="/settings.html">Settings</a></nav></aside>
  <nav class="navbar app-navbar"><div class="topbar-inner"><div><p class="topbar-kicker mb-0">Workspace</p><h1 class="topbar-title mb-0">Attendance</h1></div><button class="btn btn-sm btn-outline-secondary" id="logoutButton">Log out</button></div></nav>
  <main class="dashboard-main"><div id="alertArea" aria-live="polite"></div><div class="dashboard-heading"><div><p class="eyebrow mb-1">Team attendance</p><h1>My attendance</h1><p class="text-secondary">Business date: <strong id="businessDate">Loading…</strong></p></div></div>
    <section class="panel p-4 mb-4"><div class="section-heading"><div><span class="section-kicker">Today</span><h2 id="statusText">Loading attendance…</h2><p id="timeText" class="text-secondary mb-0"></p></div><div class="d-flex gap-2"><button class="btn btn-primary" id="checkInButton">Check in</button><button class="btn btn-outline-primary" id="checkOutButton">Check out</button></div></div></section>
    <section class="panel p-4"><div class="section-heading mb-3"><div><span class="section-kicker">History</span><h2>Recent attendance</h2></div></div><div id="historyState" class="text-secondary">Loading history…</div><div class="table-responsive"><table class="table align-middle" id="historyTable" hidden><thead><tr><th>Date</th><th>Check in</th><th>Check out</th><th>Status</th></tr></thead><tbody></tbody></table></div></section>
  </main>
  <script src="/js/attendance.js"></script>
</body>
</html>
