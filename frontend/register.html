<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | TaskFlow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/styles.css" rel="stylesheet"></head>
<body class="auth-page"><main class="auth-card"><a class="brand-link" href="/">Task<span>Flow</span></a><h1>Create your account</h1><p class="text-secondary">Your tasks stay private to your account.</p><div id="alertArea" aria-live="polite"></div><form id="registerForm" novalidate><label class="form-label" for="name">Name</label><input class="form-control mb-3" id="name" maxlength="100" required autocomplete="name"><label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" type="email" required autocomplete="email"><label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" type="password" minlength="8" required autocomplete="new-password"><label class="form-label" for="passwordConfirmation">Confirm password</label><input class="form-control mb-3" id="passwordConfirmation" type="password" required autocomplete="new-password"><button class="btn btn-primary w-100" id="submitButton">Create account</button></form><p class="mt-4 mb-0 text-center text-secondary">Already registered? <a href="/login.html">Sign in</a></p></main><script src="/js/auth.js"></script></body></html>
