<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | TaskFlow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/styles.css" rel="stylesheet"></head>
<body class="auth-page"><main class="auth-card"><a class="brand-link" href="/">Task<span>Flow</span></a><h1>Welcome back</h1><p class="text-secondary">Sign in to manage your work.</p><div id="alertArea" aria-live="polite"></div><form id="loginForm" novalidate><label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" type="email" required autocomplete="email"><label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" type="password" required autocomplete="current-password"><button class="btn btn-primary w-100" id="submitButton">Sign in</button></form><p class="mt-4 mb-0 text-center text-secondary">New to TaskFlow? <a href="/register.html">Create an account</a></p></main><script src="/js/auth.js"></script></body></html>
